<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>收費登記簿</title>
<style>
  :root{
    --bg:#fbfaf7;
    --surface:#ffffff;
    --surface-2:#f7f3ed;
    --line:#ebe4d8;
    --ink:#3b3128;
    --ink-soft:#8a7c6b;
    --accent:#9a6a43;
    --accent-bg:#f4ebe0;
    --unpaid:#b0553b;
    --unpaid-bg:#f8ece5;
    --paid:#6b7d4a;
    --paid-bg:#eef1e5;
    --exempt:#b5aa9a;
    --exempt-bg:#f5f2ec;
    --shadow:0 1px 2px rgba(80,60,40,.04),0 4px 14px rgba(80,60,40,.05);
    --paper-line:var(--line);
    --on-accent:#ffffff;
    --on-paid:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1a1714;
      --surface:#24201c;
      --surface-2:#2d2823;
      --line:#3a332c;
      --ink:#efe8de;
      --ink-soft:#a99c8b;
      --accent:#d4a77d;
      --accent-bg:#3a2e23;
      --unpaid:#e08f73;
      --unpaid-bg:#3b2620;
      --paid:#a9bd84;
      --paid-bg:#2c3222;
      --exempt:#7d7366;
      --exempt-bg:#2a2622;
      --shadow:none;
      --on-accent:#2a1d12;
      --on-paid:#1e2614;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:20px 16px 60px;
    font-size:16px;
  }
  header, .tabbar, .toolbar, #keyRow, .card, #status{max-width:520px;margin-left:auto;margin-right:auto;}
  header{margin-bottom:14px;}
  h1{font-size:1.6em;font-weight:800;margin:0 0 2px;letter-spacing:.02em;}
  .sub{font-size:.88em;color:var(--ink-soft);}

  /* 工具列 */
  .toolbar{
    display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
    margin-bottom:12px;
  }
  .toolbar .tools{display:flex;gap:6px;flex-wrap:wrap;}
  .sync-chip{
    display:inline-flex;align-items:center;gap:6px;
    font-size:.78em;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--line);
    padding:6px 10px;border-radius:999px;
  }
  .sync-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--exempt);flex:0 0 auto;}
  .sync-chip.ok::before{background:var(--paid);}
  .sync-chip.err::before{background:var(--unpaid);}
  .sync-chip.busy::before{background:var(--accent);}
  .tool-btn{
    font-size:.8em!important;padding:6px 11px!important;border-radius:999px!important;
    background:var(--surface)!important;color:var(--ink-soft)!important;border:1px solid var(--line)!important;
  }

  /* 分頁 */
  .tabbar{
    display:flex;gap:6px;overflow-x:auto;padding:4px;margin-bottom:12px;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tabbar:empty{display:none;}
  .tab, .tab-add{
    flex:0 0 auto;padding:8px 14px;border-radius:10px;
    font-size:.9em;font-weight:600;cursor:pointer;white-space:nowrap;
    color:var(--ink-soft);border:none;background:transparent;
  }
  .tab.active{background:var(--accent);color:var(--on-accent);box-shadow:0 2px 6px rgba(120,80,40,.22);}
  .tab-add{color:var(--accent);}

  /* 卡片 */
  .card{
    margin-bottom:14px;background:var(--surface);
    border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);
  }
  .card h2{font-size:1.05em;margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:.82em;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  input[type=number], input[type=text], input[type=password], textarea{
    font-family:inherit;font-size:1em;padding:11px 12px;
    border:1.5px solid var(--line);border-radius:12px;
    background:var(--surface-2);color:var(--ink);width:100%;outline:none;
    transition:border-color .15s, background .15s;
  }
  input:focus, textarea:focus{border-color:var(--accent);background:var(--surface);}
  .form-row{display:flex;gap:10px;}
  .form-row .field{flex:1;}

  /* 按鈕 */
  button{
    font-family:inherit;font-size:.92em;font-weight:600;padding:10px 16px;
    border-radius:12px;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);
    cursor:pointer;transition:transform .08s, opacity .15s;
  }
  button:active{transform:scale(.97);}
  button.secondary{background:transparent;color:var(--accent);}
  button.ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
  button.danger{background:transparent;color:var(--unpaid);border-color:var(--unpaid);}
  .btn-row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}

  /* 項目標題 */
  .project-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;}
  .project-header .name{font-size:1.2em;font-weight:800;}
  .project-header .meta{font-size:.8em;color:var(--ink-soft);margin-top:3px;}
  .icon-btn{
    background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft);
    padding:6px 10px;font-size:.76em;border-radius:999px;white-space:nowrap;
  }

  /* 快速登記 */
  .quick-entry{display:flex;gap:8px;margin-bottom:12px;}
  .quick-entry input{
    flex:1;min-width:0;font-size:1.25em;font-weight:700;padding:12px;text-align:center;letter-spacing:.05em;
  }
  .quick-entry button{flex:0 0 auto;white-space:nowrap;padding:12px 18px;font-size:1em;}

  .feedback{font-size:.88em;margin-bottom:12px;padding:10px 12px;border-radius:12px;display:none;font-weight:600;}
  .feedback.show{display:block;}
  .feedback.success{background:var(--paid-bg);color:var(--paid);}
  .feedback.neutral{background:var(--surface-2);color:var(--ink-soft);}
  .feedback.warn{background:var(--accent-bg);color:var(--accent);}
  .feedback.error{background:var(--unpaid-bg);color:var(--unpaid);}

  /* 統計 */
  .summary{
    display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;
    background:var(--surface-2);border-radius:14px;padding:12px 14px 14px;margin-bottom:14px;
  }
  .summary .count{font-size:2.2em;font-weight:800;line-height:1;color:var(--unpaid);}
  .summary .count.zero{color:var(--paid);}
  .summary .label{font-size:.8em;color:var(--ink-soft);margin-top:4px;}
  .summary .amount{font-size:.82em;color:var(--ink-soft);text-align:right;}
  .summary .amount strong{color:var(--ink);font-size:1.25em;}
  .progress{flex:1 0 100%;height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px;}
  .progress > span{display:block;height:100%;background:var(--paid);border-radius:999px;transition:width .3s;}
  .progress-text{flex:1 0 100%;font-size:.75em;color:var(--ink-soft);margin-top:-4px;}

  /* 座號格子 */
  .grid, .picker-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;}
  .picker-grid{margin-top:4px;}
  .seat, .picker-seat{
    aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:12px;font-size:1.05em;font-weight:700;user-select:none;line-height:1.15;
  }
  .seat{background:var(--unpaid-bg);color:var(--unpaid);border:1.5px solid transparent;cursor:default;}
  .seat.paid{background:var(--paid);color:var(--on-paid);}
  .seat.exempt{background:var(--exempt-bg);color:var(--exempt);border:1.5px dashed var(--line);}
  .seat.exempt:active{transform:none;}
  .seat-tag{font-size:.58em;font-weight:600;display:block;margin-top:2px;opacity:.9;}
  .picker-seat{border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;}
  .picker-seat.selected{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);}

  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76em;color:var(--ink-soft);margin-top:12px;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
  .legend .l-unpaid{background:var(--unpaid-bg);border:1px solid var(--unpaid);}
  .legend .l-paid{background:var(--paid);}
  .legend .l-exempt{background:var(--exempt-bg);border:1px dashed var(--exempt);}

  /* 名單 */
  .section-title{display:block;font-size:.82em;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;margin:16px 0 8px;}
  .section-title:first-child{margin-top:0;}
  .unpaid-list{display:flex;flex-wrap:wrap;gap:6px;font-size:.9em;}
  .unpaid-list .chip{background:var(--unpaid-bg);color:var(--unpaid);padding:4px 10px;border-radius:999px;font-weight:600;}
  .unpaid-list .none, .paid-list .none{color:var(--paid);font-weight:600;}
  .paid-list{font-size:.88em;color:var(--ink-soft);}
  .paid-list .entry{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--line);}
  .paid-list .entry:last-child{border-bottom:none;}
  .paid-list .entry b{color:var(--ink);}

  .hint{font-size:.78em;color:var(--ink-soft);margin-top:10px;line-height:1.5;}
  #status{font-size:.78em;color:var(--ink-soft);text-align:center;}
  .empty-state{max-width:520px;margin:40px auto;text-align:center;color:var(--ink-soft);font-size:.9em;}
  .amount strong{color:var(--ink);}
</style>
</head>
<body>

<header>
  <h1>收費登記簿</h1>
  <div class="sub" id="titleSub">選擇項目後點座號登記已繳／未繳</div>
</header>

<div class="toolbar">
  <div id="googleStatus" class="sync-chip">尚未連線雲端同步</div>
  <div class="tools">
    <button class="ghost tool-btn" id="googleSignInBtn">連線同步</button>
    <button class="ghost tool-btn" id="refreshBtn">重新整理</button>
    <button class="ghost tool-btn" id="exportBtn">備份</button>
    <button class="ghost tool-btn" id="importBtn">還原</button>
  </div>
</div>

<div id="keyRow" style="display:none;margin-bottom:12px;gap:8px;align-items:center;">
  <input type="password" id="keyInput" placeholder="輸入同步密碼" autocomplete="current-password" style="flex:1;min-width:0;">
  <button id="keySubmitBtn" style="font-size:0.85em;padding:8px 12px;">確定</button>
</div>



<div class="tabbar" id="tabbar"></div>

<div id="newProjectCard" class="card" style="display:none;">
  <h2>新增項目</h2>
  <div class="field">
    <label>項目名稱</label>
    <input type="text" id="newName" placeholder="例如：班費、畢業旅行費">
  </div>
  <div class="form-row">
    <div class="field">
      <label>人數</label>
      <input type="number" id="newTotal" min="1" max="60" value="37">
    </div>
    <div class="field">
      <label>每人金額（選填）</label>
      <input type="number" id="newAmount" min="0" placeholder="0">
    </div>
  </div>
  <div class="btn-row">
    <button class="ghost" id="cancelNew">取消</button>
    <button id="createProject">建立項目</button>
  </div>
</div>

<div id="editProjectCard" class="card" style="display:none;">
  <h2>編輯項目</h2>
  <div class="field">
    <label>項目名稱</label>
    <input type="text" id="editName">
  </div>
  <div class="form-row">
    <div class="field">
      <label>人數</label>
      <input type="number" id="editTotal" min="1" max="60">
    </div>
    <div class="field">
      <label>每人金額（選填）</label>
      <input type="number" id="editAmount" min="0">
    </div>
  </div>
  <div class="field">
    <label>不用繳交的座號（點選切換）</label>
    <div class="picker-grid" id="editExemptGrid"></div>
  </div>
  <div class="field" id="deleteConfirmBar" style="display:none;background:var(--unpaid-bg);border:1px solid var(--unpaid);border-radius:12px;padding:12px;">
    <div style="font-size:0.85em;margin-bottom:8px;">確定要刪除這個項目嗎？資料刪除後無法復原。</div>
    <div class="btn-row">
      <button class="ghost" id="cancelDeleteConfirm">取消</button>
      <button class="danger" id="confirmDeleteBtn" style="border-color:var(--unpaid);color:#fff;background:var(--unpaid);">確定刪除</button>
    </div>
  </div>
  <div class="btn-row">
    <button class="danger" id="deleteProject">刪除此項目</button>
    <button class="ghost" id="cancelEdit">取消</button>
    <button id="saveEdit">儲存</button>
  </div>
</div>

<div id="backupCard" class="card" style="display:none;">
  <h2 id="backupTitle">備份資料</h2>
  <div class="field">
    <label id="backupHint">複製下方文字保存起來，需要時貼回這裡即可還原</label>
    <textarea id="backupText" rows="6" style="font-family:monospace;font-size:0.8em;"></textarea>
  </div>
  <div class="btn-row">
    <button class="ghost" id="cancelBackup">關閉</button>
    <button id="backupActionBtn">複製</button>
  </div>
</div>

<div id="mainArea"></div>

<div id="status">正在載入資料…</div>

<script>
const STORAGE_KEY = 'fee-tracker-projects';
let state = { projects: [], activeId: null };
let editingProjectId = null;

const tabbar = document.getElementById('tabbar');
const mainArea = document.getElementById('mainArea');
const statusEl = document.getElementById('status');
const titleSub = document.getElementById('titleSub');

const newProjectCard = document.getElementById('newProjectCard');
const newName = document.getElementById('newName');
const newTotal = document.getElementById('newTotal');
const newAmount = document.getElementById('newAmount');

const editProjectCard = document.getElementById('editProjectCard');
const editName = document.getElementById('editName');
const editTotal = document.getElementById('editTotal');
const editAmount = document.getElementById('editAmount');
const editExemptGrid = document.getElementById('editExemptGrid');
let tempExempt = new Set();

const backupCard = document.getElementById('backupCard');
const backupTitle = document.getElementById('backupTitle');
const backupHint = document.getElementById('backupHint');
const backupText = document.getElementById('backupText');
const backupActionBtn = document.getElementById('backupActionBtn');
let backupMode = 'export';


// ===== Google Apps Script 雲端同步設定 =====
// 請把下面這段換成你部署 Apps Script 網頁應用程式後拿到的網址
// （格式類似：https://script.google.com/macros/s/AKfycb.../exec）
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzSqI1GyeS4KB_wjP3kxqaPM2ySCntpBZzAEXkZ_xkpHobbZVueBtFRkJvFmMhSbaR5aw/exec';

function syncAvailable(){
  return APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf('請貼上') !== 0;
}

function setSync(text){
  const el = document.getElementById('googleStatus');
  el.textContent = text;
  el.className = 'sync-chip' + (/已連線/.test(text) ? ' ok' : /失敗|錯誤|密碼/.test(text) ? ' err' : /同步中/.test(text) ? ' busy' : '');
}

// ===== 同步密碼 =====
// 密碼只存在這台裝置的瀏覽器裡，不會寫在網頁程式碼中
const SYNC_KEY_STORAGE = 'fee-tracker-sync-key';
const keyRow = document.getElementById('keyRow');
const keyInput = document.getElementById('keyInput');
let needKey = false;

function getSyncKey(){
  try{ return localStorage.getItem(SYNC_KEY_STORAGE) || ''; }catch(e){ return ''; }
}
function setSyncKey(k){
  try{ localStorage.setItem(SYNC_KEY_STORAGE, k); }catch(e){}
}
function showKeyRow(msg){
  needKey = true;
  keyRow.style.display = 'flex';
  setSync(msg);
  keyInput.value = '';
  keyInput.focus();
}
function hideKeyRow(){
  needKey = false;
  keyRow.style.display = 'none';
}

// 所有雲端請求都走 POST，密碼放在內容裡，不放在網址
async function callCloud(action, data){
  const key = getSyncKey();
  if(!key){
    showKeyRow('請輸入同步密碼才能連線雲端');
    return null;
  }
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ key: key, action: action, data: data })
  });
  if(!res.ok) throw new Error('fetch failed');
  const json = await res.json();
  if(json && json.status === 'unauthorized'){
    setSyncKey('');
    showKeyRow('密碼錯誤，請重新輸入同步密碼');
    return null;
  }
  if(!json || json.status !== 'ok') throw new Error('bad response');
  hideKeyRow();
  return json;
}

function submitKey(){
  const k = keyInput.value.trim();
  if(!k) return;
  setSyncKey(k);
  pullFromCloud();
}
document.getElementById('keySubmitBtn').addEventListener('click', submitKey);
keyInput.addEventListener('keydown', e => { if(e.key === 'Enter') submitKey(); });

async function pullFromCloud(){
  if(!syncAvailable()) return false;
  try{
    setSync('同步中…');
    const json = await callCloud('get');
    if(!json) return false;
    const remote = json.data;
    if(remote && Array.isArray(remote.projects) && remote.projects.length === 0 && state.projects.length > 0){
      // 雲端是空的、但這台裝置有資料：把本機資料上傳，不要被空資料蓋掉
      await pushToCloud();
    } else if(remote && Array.isArray(remote.projects)){
      remote.projects.forEach(p => {
        if(!Array.isArray(p.exempt)) p.exempt = [];
        if(!p.paidDates || typeof p.paidDates !== 'object') p.paidDates = {};
        if(typeof p.closed !== 'boolean') p.closed = false;
        if(!('closedDate' in p)) p.closedDate = null;
      });
      state = remote;
      saveLocal();
      render();
    }
    setSync('已連線雲端同步');
    return true;
  }catch(e){
    console.error('pullFromCloud failed', e);
    setSync('雲端同步失敗，暫時使用此裝置的資料');
    return false;
  }
}

async function pushToCloud(){
  if(!syncAvailable() || needKey) return;
  try{
    const json = await callCloud('set', state);
    if(json) setSync('已連線雲端同步');
  }catch(e){
    console.error('pushToCloud failed', e);
    setSync('雲端同步失敗，資料已先存在此裝置');
  }
}

document.getElementById('googleSignInBtn').addEventListener('click', () => {
  if(!syncAvailable()){
    setSync('尚未設定雲端同步，請聯絡開發者完成設定');
    return;
  }
  pullFromCloud();
});

document.getElementById('refreshBtn').addEventListener('click', () => {
  location.reload();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  backupMode = 'export';
  newProjectCard.style.display = 'none';
  editProjectCard.style.display = 'none';
  mainArea.style.display = 'none';
  backupCard.style.display = 'block';
  backupTitle.textContent = '備份資料';
  backupHint.style.color = '';
  backupHint.textContent = '點「複製」把下方文字存到備忘錄或訊息裡，之後可用「還原備份」貼回來';
  backupText.value = JSON.stringify(state);
  backupActionBtn.textContent = '複製';
  backupText.focus();
  backupText.select();
});

document.getElementById('importBtn').addEventListener('click', () => {
  backupMode = 'import';
  newProjectCard.style.display = 'none';
  editProjectCard.style.display = 'none';
  mainArea.style.display = 'none';
  backupCard.style.display = 'block';
  backupTitle.textContent = '還原備份';
  backupHint.style.color = '';
  backupHint.textContent = '把之前複製的備份文字貼在下方，再按「還原」';
  backupText.value = '';
  backupActionBtn.textContent = '還原';
  backupText.focus();
});

document.getElementById('cancelBackup').addEventListener('click', () => {
  closeForms();
});

backupActionBtn.addEventListener('click', async () => {
  if(backupMode === 'export'){
    try{
      await navigator.clipboard.writeText(backupText.value);
      backupActionBtn.textContent = '已複製 ✓';
      setTimeout(() => { backupActionBtn.textContent = '複製'; }, 1500);
    }catch(e){
      backupText.select();
    }
  } else {
    try{
      const parsed = JSON.parse(backupText.value);
      if(!parsed || !Array.isArray(parsed.projects)) throw new Error('格式錯誤');
      parsed.projects.forEach(p => { if(!Array.isArray(p.exempt)) p.exempt = []; });
      state = parsed;
      closeForms();
      render();
      saveState();
    }catch(e){
      backupHint.textContent = '還原失敗，請確認貼上的內容是完整的備份文字';
      backupHint.style.color = 'var(--unpaid)';
    }
  }
});

function uid(){
  return 'p' + Date.now() + Math.floor(Math.random()*1000);
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.projects)){
        state = parsed;
        state.projects.forEach(p => {
          if(!Array.isArray(p.exempt)) p.exempt = [];
          if(!p.paidDates || typeof p.paidDates !== 'object') p.paidDates = {};
          if(typeof p.closed !== 'boolean') p.closed = false;
          if(!('closedDate' in p)) p.closedDate = null;
        });
      }
    }
  }catch(e){
    // no data yet, or storage unavailable
  }
  statusEl.textContent = '';
  if(state.projects.length === 0){
    openNewProjectForm(true);
  }
  render();
  if(syncAvailable()){
    pullFromCloud();
  }
}

function saveLocal(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('localStorage save failed', e);
    statusEl.textContent = '儲存失敗：瀏覽器儲存空間可能已滿或被封鎖（例如無痕模式）';
  }
}

function saveState(){
  saveLocal();
  pushToCloud();
}

function getActiveProject(){
  return state.projects.find(p => p.id === state.activeId) || null;
}

let archiveView = false;

function render(){
  renderTabs();
  if(archiveView){
    renderArchive();
    titleSub.textContent = '封存項目';
    return;
  }
  const proj = getActiveProject();
  if(!proj){
    mainArea.innerHTML = '';
    titleSub.textContent = state.projects.length === 0 ? '尚未建立任何項目' : '請選擇一個項目';
    return;
  }
  titleSub.textContent = proj.name + '・共 ' + proj.total + ' 人' + (proj.amount ? '・每人 ' + proj.amount + ' 元' : '');
  renderProject(proj);
}

function renderTabs(){
  tabbar.innerHTML = '';
  const openProjects = state.projects.filter(p => !p.closed);
  const closedProjects = state.projects.filter(p => p.closed);
  openProjects.forEach(p => {
    const btn = document.createElement('div');
    const unpaidN = p.total - p.paid.length - (p.exempt ? p.exempt.length : 0);
    btn.className = 'tab' + (!archiveView && p.id === state.activeId ? ' active' : '');
    btn.textContent = p.name + (unpaidN > 0 ? ' (' + unpaidN + ')' : ' ✓');
    btn.addEventListener('click', () => {
      archiveView = false;
      state.activeId = p.id;
      lastAction = null;
      closeForms();
      render();
      saveState();
    });
    tabbar.appendChild(btn);
  });
  const addBtn = document.createElement('div');
  addBtn.className = 'tab-add';
  addBtn.textContent = '+ 新增項目';
  addBtn.addEventListener('click', () => { archiveView = false; openNewProjectForm(false); });
  tabbar.appendChild(addBtn);

  if(closedProjects.length > 0){
    const archiveBtn = document.createElement('div');
    archiveBtn.className = 'tab' + (archiveView ? ' active' : '');
    archiveBtn.style.marginLeft = '4px';
    archiveBtn.textContent = '📦 封存 (' + closedProjects.length + ')';
    archiveBtn.addEventListener('click', () => {
      archiveView = true;
      closeForms();
      render();
    });
    tabbar.appendChild(archiveBtn);
  }
}

function renderProject(proj){
  const exempt = proj.exempt || [];
  const unpaidSeats = [];
  for(let i = 1; i <= proj.total; i++){
    if(exempt.includes(i)) continue;
    if(!proj.paid.includes(i)) unpaidSeats.push(i);
  }
  const payerCount = proj.total - exempt.length;

  const wrap = document.createElement('div');

  const card1 = document.createElement('div');
  card1.className = 'card';

  const headerRow = document.createElement('div');
  headerRow.className = 'project-header';
  headerRow.innerHTML = `
    <div>
      <div class="name">${escapeHtml(proj.name)}</div>
      <div class="meta">共 ${proj.total} 人${exempt.length ? '（免繳 ' + exempt.length + ' 人）' : ''}${proj.amount ? '・每人 ' + proj.amount + ' 元' : ''}</div>
    </div>
  `;
  const editBtn = document.createElement('button');
  editBtn.className = 'icon-btn';
  editBtn.textContent = '編輯項目';
  editBtn.addEventListener('click', () => openEditProjectForm(proj));

  const archiveBtn = document.createElement('button');
  archiveBtn.className = 'icon-btn';
  archiveBtn.textContent = '封存項目';
  archiveBtn.addEventListener('click', () => {
    proj.closed = true;
    proj.closedDate = new Date().toISOString();
    const nextOpen = state.projects.find(p => !p.closed);
    state.activeId = nextOpen ? nextOpen.id : null;
    lastAction = null;
    render();
    saveState();
  });

  const headerBtns = document.createElement('div');
  headerBtns.style.display = 'flex';
  headerBtns.style.gap = '6px';
  headerBtns.appendChild(editBtn);
  headerBtns.appendChild(archiveBtn);
  headerRow.appendChild(headerBtns);
  card1.appendChild(headerRow);

  const feedback = document.createElement('div');
  feedback.id = 'feedbackMsg';
  if(lastAction){
    feedback.className = 'feedback show ' + lastAction.type;
    feedback.textContent = lastAction.text;
  } else {
    feedback.className = 'feedback';
  }
  card1.appendChild(feedback);

  const quickEntry = document.createElement('div');
  quickEntry.className = 'quick-entry';
  const seatInput = document.createElement('input');
  seatInput.type = 'number';
  seatInput.id = 'manualSeatInput';
  seatInput.placeholder = '輸入座號';
  seatInput.setAttribute('inputmode', 'numeric');
  seatInput.setAttribute('min', '1');
  seatInput.setAttribute('max', String(proj.total));
  const seatBtn = document.createElement('button');
  seatBtn.textContent = '登記已繳';
  seatBtn.id = 'manualSeatBtn';
  seatBtn.addEventListener('click', () => submitManualEntry(proj));
  seatInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      submitManualEntry(proj);
    }
  });
  quickEntry.appendChild(seatInput);
  quickEntry.appendChild(seatBtn);
  card1.appendChild(quickEntry);

  const focusTarget = focusManualInputAfterRender;
  focusManualInputAfterRender = false;

  const summary = document.createElement('div');
  summary.className = 'summary';
  const collected = proj.paid.length * (proj.amount || 0);
  const expected = payerCount * (proj.amount || 0);
  summary.innerHTML = `
    <div>
      <div class="count ${unpaidSeats.length === 0 ? 'zero' : ''}">${unpaidSeats.length}</div>
      <div class="label">尚未繳交</div>
    </div>
    ${proj.amount ? `<div class="amount">已收金額<br><strong>${collected}</strong> / ${expected} 元</div>` : ''}
    <div class="progress"><span style="width:${payerCount > 0 ? Math.round(proj.paid.length / payerCount * 100) : 100}%"></span></div>
    <div class="progress-text">已繳 ${proj.paid.length} / ${payerCount} 人</div>
  `;
  card1.appendChild(summary);

  const grid = document.createElement('div');
  grid.className = 'grid';
  for(let i = 1; i <= proj.total; i++){
    const isExempt = exempt.includes(i);
    const isPaid = proj.paid.includes(i);
    const el = document.createElement('div');
    if(isExempt){
      el.className = 'seat exempt';
      el.innerHTML = '<span class="seat-num">' + i + '</span><span class="seat-tag">免繳</span>';
    } else if(isPaid){
      el.className = 'seat paid';
      const dateStr = proj.paidDates && proj.paidDates[i] ? formatShortDate(proj.paidDates[i]) : '';
      el.innerHTML = '<span class="seat-num">' + i + '</span>' + (dateStr ? '<span class="seat-tag">' + dateStr + '</span>' : '');
    } else {
      el.className = 'seat';
      el.textContent = i;
    }
    grid.appendChild(el);
  }
  card1.appendChild(grid);

  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = '同一座號再輸入一次可改回未繳。格子僅供查看，無法直接點選。';
  const legend = document.createElement('div');
  legend.className = 'legend';
  legend.innerHTML = '<span><i class="l-unpaid"></i>未繳</span><span><i class="l-paid"></i>已繳</span><span><i class="l-exempt"></i>免繳</span>';
  card1.appendChild(legend);
  card1.appendChild(hint);

  wrap.appendChild(card1);

  const card2 = document.createElement('div');
  card2.className = 'card';
  const listTitle = document.createElement('span');
  listTitle.className = 'section-title';
  listTitle.textContent = '未繳名單';
  card2.appendChild(listTitle);

  const list = document.createElement('div');
  list.className = 'unpaid-list';
  if(unpaidSeats.length === 0){
    list.innerHTML = '<span class="none">全部繳交完畢</span>';
  } else {
    list.innerHTML = unpaidSeats.map(n => '<span class="chip">' + n + ' 號</span>').join('');
  }
  card2.appendChild(list);

  const paidTitle = document.createElement('span');
  paidTitle.className = 'section-title';
  paidTitle.textContent = '已繳記錄';
  card2.appendChild(paidTitle);

  const paidListEl = document.createElement('div');
  paidListEl.className = 'paid-list';
  const paidSeatsSorted = proj.paid.slice().sort((a,b) => a - b);
  if(paidSeatsSorted.length === 0){
    paidListEl.innerHTML = '<span class="none">尚無登記</span>';
  } else {
    paidListEl.innerHTML = paidSeatsSorted.map(n => {
      const d = proj.paidDates && proj.paidDates[n] ? formatDT(proj.paidDates[n]) : '';
      return '<div class="entry"><b>' + n + ' 號</b><span>' + d + '</span></div>';
    }).join('');
  }
  card2.appendChild(paidListEl);

  const resetRow = document.createElement('div');
  resetRow.style.marginTop = '10px';
  resetRow.style.textAlign = 'right';
  const resetBtn = document.createElement('button');
  resetBtn.className = 'ghost';
  resetBtn.textContent = '全部重設為未繳';
  const resetConfirmBar = document.createElement('div');
  resetConfirmBar.style.display = 'none';
  resetConfirmBar.style.marginTop = '8px';
  resetConfirmBar.style.background = 'var(--unpaid-bg)';
  resetConfirmBar.style.border = '1px solid var(--unpaid)';
  resetConfirmBar.style.borderRadius = '12px';
  resetConfirmBar.style.padding = '10px';
  resetConfirmBar.innerHTML = `
    <div style="font-size:0.85em;margin-bottom:8px;">確定要將「${escapeHtml(proj.name)}」所有人重設為未繳嗎？</div>
  `;
  const resetConfirmActions = document.createElement('div');
  resetConfirmActions.className = 'btn-row';
  const resetCancelBtn = document.createElement('button');
  resetCancelBtn.className = 'ghost';
  resetCancelBtn.textContent = '取消';
  resetCancelBtn.addEventListener('click', () => { resetConfirmBar.style.display = 'none'; });
  const resetConfirmBtn = document.createElement('button');
  resetConfirmBtn.textContent = '確定重設';
  resetConfirmBtn.style.background = 'var(--unpaid)';
  resetConfirmBtn.style.borderColor = 'var(--unpaid)';
  resetConfirmBtn.addEventListener('click', () => {
    proj.paid = [];
    proj.paidDates = {};
    lastAction = null;
    render();
    saveState();
  });
  resetConfirmActions.appendChild(resetCancelBtn);
  resetConfirmActions.appendChild(resetConfirmBtn);
  resetConfirmBar.appendChild(resetConfirmActions);
  resetBtn.addEventListener('click', () => {
    resetConfirmBar.style.display = 'block';
  });
  resetRow.appendChild(resetBtn);
  card2.appendChild(resetRow);
  card2.appendChild(resetConfirmBar);

  wrap.appendChild(card2);

  mainArea.innerHTML = '';
  mainArea.appendChild(wrap);

  if(focusTarget){
    const el = document.getElementById('manualSeatInput');
    if(el){ el.value = ''; el.focus(); }
  }
}

function renderArchive(){
  mainArea.innerHTML = '';
  const closedProjects = state.projects.filter(p => p.closed);
  if(closedProjects.length === 0){
    const empty = document.createElement('div');
    empty.className = 'card';
    empty.innerHTML = '<div class="hint" style="margin:0;">目前沒有封存項目</div>';
    mainArea.appendChild(empty);
    return;
  }
  closedProjects
    .slice()
    .sort((a,b) => (b.closedDate || '').localeCompare(a.closedDate || ''))
    .forEach(proj => {
      const exempt = proj.exempt || [];
      const collected = proj.paid.length * (proj.amount || 0);
      const payerCount = proj.total - exempt.length;
      const expected = payerCount * (proj.amount || 0);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="project-header">
          <div>
            <div class="name">${escapeHtml(proj.name)}</div>
            <div class="meta">共 ${proj.total} 人${exempt.length ? '（免繳 ' + exempt.length + ' 人）' : ''}${proj.amount ? '・每人 ' + proj.amount + ' 元' : ''}</div>
            <div class="meta">封存於 ${proj.closedDate ? formatDT(proj.closedDate) : ''}</div>
          </div>
        </div>
        ${proj.amount ? `<div class="amount" style="text-align:left;margin-bottom:10px;">已收金額 <strong>${collected}</strong> / ${expected} 元</div>` : ''}
      `;
      const btnRow = document.createElement('div');
      btnRow.className = 'btn-row';
      const restoreBtn = document.createElement('button');
      restoreBtn.className = 'secondary';
      restoreBtn.textContent = '還原此項目';
      restoreBtn.addEventListener('click', () => {
        proj.closed = false;
        proj.closedDate = null;
        state.activeId = proj.id;
        archiveView = false;
        render();
        saveState();
      });
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'danger';
      deleteBtn.textContent = '刪除';
      deleteBtn.addEventListener('click', () => {
        if(deleteBtn.textContent === '刪除'){
          deleteBtn.textContent = '確定刪除？';
          deleteBtn.style.background = 'var(--unpaid)';
          deleteBtn.style.color = '#fff';
          return;
        }
        state.projects = state.projects.filter(p => p.id !== proj.id);
        render();
        saveState();
      });
      btnRow.appendChild(restoreBtn);
      btnRow.appendChild(deleteBtn);
      card.appendChild(btnRow);
      mainArea.appendChild(card);
    });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

let lastAction = null;
let focusManualInputAfterRender = false;

function pad2(n){ return String(n).padStart(2, '0'); }

function formatDT(iso){
  const d = new Date(iso);
  return pad2(d.getMonth()+1) + '/' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

function formatShortDate(iso){
  const d = new Date(iso);
  return pad2(d.getMonth()+1) + '/' + pad2(d.getDate());
}

function markSeat(proj, n, viaInput){
  const exempt = proj.exempt || [];
  if(!proj.paidDates) proj.paidDates = {};
  if(exempt.includes(n)){
    lastAction = { text: '座號 ' + n + ' 是免繳座號，不需登記', type: 'warn' };
    focusManualInputAfterRender = viaInput;
    render();
    return;
  }
  const idx = proj.paid.indexOf(n);
  if(idx === -1){
    proj.paid.push(n);
    const now = new Date().toISOString();
    proj.paidDates[n] = now;
    lastAction = { text: '座號 ' + n + ' 已登記為已繳（' + formatDT(now) + '）', type: 'success' };
  } else {
    proj.paid.splice(idx, 1);
    delete proj.paidDates[n];
    lastAction = { text: '座號 ' + n + ' 已改回未繳', type: 'neutral' };
  }
  focusManualInputAfterRender = viaInput;
  render();
  saveState();
}

function submitManualEntry(proj){
  const inputEl = document.getElementById('manualSeatInput');
  const val = inputEl ? inputEl.value.trim() : '';
  const n = parseInt(val);
  if(!val || isNaN(n) || n < 1 || n > proj.total){
    lastAction = { text: '請輸入 1 - ' + proj.total + ' 之間的座號', type: 'error' };
    focusManualInputAfterRender = true;
    render();
    return;
  }
  markSeat(proj, n, true);
}

function closeForms(){
  newProjectCard.style.display = 'none';
  editProjectCard.style.display = 'none';
  backupCard.style.display = 'none';
  mainArea.style.display = '';
}

function openNewProjectForm(isFirst){
  editProjectCard.style.display = 'none';
  backupCard.style.display = 'none';
  newProjectCard.style.display = 'block';
  mainArea.style.display = isFirst ? 'none' : '';
  newName.value = '';
  newTotal.value = 37;
  newAmount.value = '';
  newName.focus();
}

document.getElementById('cancelNew').addEventListener('click', () => {
  if(state.projects.length === 0) return; // must create at least one
  closeForms();
});

document.getElementById('createProject').addEventListener('click', () => {
  const name = newName.value.trim() || '未命名項目';
  const total = Math.max(1, Math.min(60, parseInt(newTotal.value) || 37));
  const amount = Math.max(0, parseInt(newAmount.value) || 0);
  const proj = { id: uid(), name, total, amount, paid: [], exempt: [], paidDates: {}, closed: false, closedDate: null };
  state.projects.push(proj);
  state.activeId = proj.id;
  closeForms();
  render();
  saveState();
});

function renderExemptPicker(){
  const total = Math.max(1, Math.min(60, parseInt(editTotal.value) || 1));
  editExemptGrid.innerHTML = '';
  for(let i = 1; i <= total; i++){
    const el = document.createElement('div');
    el.className = 'picker-seat' + (tempExempt.has(i) ? ' selected' : '');
    el.textContent = i;
    el.addEventListener('click', () => {
      if(tempExempt.has(i)) tempExempt.delete(i);
      else tempExempt.add(i);
      el.classList.toggle('selected');
    });
    editExemptGrid.appendChild(el);
  }
}

editTotal.addEventListener('input', renderExemptPicker);

function openEditProjectForm(proj){
  editingProjectId = proj.id;
  newProjectCard.style.display = 'none';
  backupCard.style.display = 'none';
  editProjectCard.style.display = 'block';
  mainArea.style.display = 'none';
  editName.value = proj.name;
  editTotal.value = proj.total;
  editAmount.value = proj.amount || '';
  tempExempt = new Set(proj.exempt || []);
  renderExemptPicker();
  document.getElementById('deleteConfirmBar').style.display = 'none';
}

document.getElementById('cancelEdit').addEventListener('click', () => {
  editingProjectId = null;
  closeForms();
});

document.getElementById('saveEdit').addEventListener('click', () => {
  const proj = state.projects.find(p => p.id === editingProjectId);
  if(!proj) return;
  proj.name = editName.value.trim() || proj.name;
  const total = Math.max(1, Math.min(60, parseInt(editTotal.value) || proj.total));
  proj.total = total;
  proj.amount = Math.max(0, parseInt(editAmount.value) || 0);
  proj.exempt = Array.from(tempExempt).filter(n => n <= total);
  proj.paid = proj.paid.filter(n => n <= total && !proj.exempt.includes(n));
  if(!proj.paidDates) proj.paidDates = {};
  Object.keys(proj.paidDates).forEach(k => {
    if(!proj.paid.includes(parseInt(k))) delete proj.paidDates[k];
  });
  editingProjectId = null;
  closeForms();
  render();
  saveState();
});

document.getElementById('deleteProject').addEventListener('click', () => {
  document.getElementById('deleteConfirmBar').style.display = 'block';
});

document.getElementById('cancelDeleteConfirm').addEventListener('click', () => {
  document.getElementById('deleteConfirmBar').style.display = 'none';
});

document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
  const proj = state.projects.find(p => p.id === editingProjectId);
  if(!proj) return;
  state.projects = state.projects.filter(p => p.id !== editingProjectId);
  if(state.activeId === editingProjectId){
    state.activeId = state.projects.length > 0 ? state.projects[0].id : null;
  }
  editingProjectId = null;
  document.getElementById('deleteConfirmBar').style.display = 'none';
  closeForms();
  if(state.projects.length === 0){
    openNewProjectForm(true);
  }
  render();
  saveState();
});

loadState();
</script>
