<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>收費登記簿</title>
<style>
  :root{
    --paper: #f6f3ec;
    --paper-line: #d9d2c2;
    --ink: #2c2a26;
    --ink-soft: #6b665c;
    --unpaid: #b5432f;
    --unpaid-bg: #f5e2dd;
    --paid: #3a6650;
    --paid-bg: #e2ebe3;
    --accent: #8a6d3b;
    --accent-bg: #efe6d4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image: linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 2.4em;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding: 20px 16px 60px;
  }
  header{
    max-width:480px;
    margin:0 auto 14px;
  }
  h1{
    font-size:1.5em;
    font-weight:700;
    margin:0 0 4px;
    letter-spacing:0.02em;
  }
  .sub{
    font-size:0.85em;
    color:var(--ink-soft);
  }

  /* Tabs */
  .tabbar{
    max-width:480px;
    margin:0 auto 12px;
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:4px;
    -webkit-overflow-scrolling:touch;
  }
  .tabbar::-webkit-scrollbar{height:4px;}
  .tab{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:8px;
    border:1px solid var(--paper-line);
    background:#fffdf9;
    color:var(--ink-soft);
    font-size:0.88em;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{
    border-color:var(--accent);
    background:var(--accent-bg);
    color:var(--accent);
  }
  .tab-add{
    flex:0 0 auto;
    padding:8px 12px;
    border-radius:8px;
    border:1px dashed var(--paper-line);
    background:transparent;
    color:var(--ink-soft);
    font-size:0.88em;
    cursor:pointer;
  }

  .card{
    max-width:480px;
    margin:0 auto 16px;
    background:#fffdf9;
    border:1px solid var(--paper-line);
    border-radius:10px;
    padding:16px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.03);
  }
  .card h2{
    font-size:1em;
    margin:0 0 12px;
  }
  .field{
    margin-bottom:12px;
  }
  .field label{
    display:block;
    font-size:0.82em;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  input[type=number], input[type=text]{
    font-family:inherit;
    font-size:1em;
    padding:9px 10px;
    border:1px solid var(--paper-line);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
    width:100%;
  }
  .form-row{
    display:flex;
    gap:10px;
  }
  .form-row .field{flex:1;}
  button{
    font-family:inherit;
    font-size:0.9em;
    padding:9px 16px;
    border-radius:6px;
    border:1px solid var(--accent);
    background:var(--accent);
    color:#fff;
    cursor:pointer;
  }
  button.secondary{
    background:transparent;
    color:var(--accent);
  }
  button.ghost{
    background:transparent;
    color:var(--ink-soft);
    border-color:var(--paper-line);
  }
  button.danger{
    background:transparent;
    color:var(--unpaid);
    border-color:var(--unpaid);
  }
  .btn-row{
    display:flex;
    gap:8px;
    justify-content:flex-end;
  }

  .project-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:8px;
  }
  .project-header .name{
    font-size:1.1em;
    font-weight:700;
  }
  .project-header .meta{
    font-size:0.8em;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .icon-btn{
    background:transparent;
    border:1px solid var(--paper-line);
    color:var(--ink-soft);
    padding:5px 10px;
    font-size:0.78em;
    border-radius:6px;
  }

  .summary{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
  }
  .summary .count{
    font-size:2em;
    font-weight:700;
    color:var(--unpaid);
  }
  .summary .count.zero{color:var(--paid);}
  .summary .label{
    font-size:0.8em;
    color:var(--ink-soft);
  }
  .summary .amount{
    font-size:0.85em;
    color:var(--ink-soft);
    text-align:right;
  }
  .summary .amount strong{
    color:var(--ink);
    font-size:1.1em;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap:8px;
  }
  .seat{
    aspect-ratio:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    font-size:1.05em;
    font-weight:600;
    border:1.5px solid var(--unpaid);
    background:var(--unpaid-bg);
    color:var(--unpaid);
    cursor:default;
    user-select:none;
    line-height:1.15;
  }
  .quick-entry{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .quick-entry input{
    flex:1;
    font-size:1.1em;
    padding:10px 12px;
    text-align:center;
  }
  .quick-entry button{
    flex:0 0 auto;
    white-space:nowrap;
  }
  .feedback{
    font-size:0.85em;
    margin-bottom:10px;
    padding:8px 10px;
    border-radius:6px;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.success{background:var(--paid-bg);color:var(--paid);}
  .feedback.neutral{background:#efece4;color:var(--ink-soft);}
  .feedback.warn{background:#f5ecd8;color:#8a6d3b;}
  .feedback.error{background:var(--unpaid-bg);color:var(--unpaid);}
  .paid-list{
    font-size:0.9em;
    line-height:1.9;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .paid-list .entry{
    display:inline-block;
    margin-right:10px;
  }
  .section-title{
    font-size:0.9em;
    font-weight:700;
    display:block;
    margin-top:14px;
  }
  .section-title:first-child{margin-top:0;}
  .seat.paid{
    border-color:var(--paid);
    background:var(--paid-bg);
    color:var(--paid);
  }
  .seat.exempt{
    border-color:var(--paper-line);
    background:#efece4;
    color:#a39d8e;
    cursor:default;
  }
  .seat.exempt:active{transform:none;}
  .seat-tag{
    font-size:0.6em;
    display:block;
    margin-top:1px;
  }
  .picker-grid{
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap:8px;
    margin-top:4px;
  }
  .picker-seat{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    font-size:1.05em;
    font-weight:600;
    border:1.5px solid var(--paper-line);
    background:#fff;
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
  }
  .picker-seat.selected{
    border-color:var(--accent);
    background:var(--accent-bg);
    color:var(--accent);
  }
  .unpaid-list{
    font-size:0.9em;
    line-height:1.9;
    color:var(--ink);
  }
  .unpaid-list .none{
    color:var(--paid);
  }
  .hint{
    font-size:0.78em;
    color:var(--ink-soft);
    margin-top:8px;
  }
  #status{
    font-size:0.78em;
    color:var(--ink-soft);
    text-align:center;
    max-width:480px;
    margin:0 auto;
  }
  .empty-state{
    max-width:480px;
    margin:40px auto;
    text-align:center;
    color:var(--ink-soft);
    font-size:0.9em;
  }
</style>
</head>
<body>

<header>
  <h1>收費登記簿</h1>
  <div class="sub" id="titleSub">選擇項目後點座號登記已繳／未繳</div>
</header>

<div class="tabbar" id="tabbar"></div>

<div style="max-width:480px;margin:0 auto 12px;display:flex;gap:8px;justify-content:flex-end;">
  <button class="ghost" id="refreshBtn" style="font-size:0.78em;padding:6px 10px;">重新整理</button>
  <button class="ghost" id="exportBtn" style="font-size:0.78em;padding:6px 10px;">備份資料</button>
  <button class="ghost" id="importBtn" style="font-size:0.78em;padding:6px 10px;">還原備份</button>
</div>

<div id="newProjectCard" class="card" style="display:none;">
  <h2>新增項目</h2>
  <div class="field">
    <label>項目名稱</label>
    <input type="text" id="newName" placeholder="例如：班費、畢業旅行費">
  </div>
  <div class="form-row">
    <div class="field">
      <label>人數</label>
      <input type="number" id="newTotal" min="1" max="60" value="37">
    </div>
    <div class="field">
      <label>每人金額（選填）</label>
      <input type="number" id="newAmount" min="0" placeholder="0">
    </div>
  </div>
  <div class="btn-row">
    <button class="ghost" id="cancelNew">取消</button>
    <button id="createProject">建立項目</button>
  </div>
</div>

<div id="editProjectCard" class="card" style="display:none;">
  <h2>編輯項目</h2>
  <div class="field">
    <label>項目名稱</label>
    <input type="text" id="editName">
  </div>
  <div class="form-row">
    <div class="field">
      <label>人數</label>
      <input type="number" id="editTotal" min="1" max="60">
    </div>
    <div class="field">
      <label>每人金額（選填）</label>
      <input type="number" id="editAmount" min="0">
    </div>
  </div>
  <div class="field">
    <label>不用繳交的座號（點選切換）</label>
    <div class="picker-grid" id="editExemptGrid"></div>
  </div>
  <div class="field" id="deleteConfirmBar" style="display:none;background:#f5e2dd;border:1px solid var(--unpaid);border-radius:6px;padding:10px;">
    <div style="font-size:0.85em;margin-bottom:8px;">確定要刪除這個項目嗎？資料刪除後無法復原。</div>
    <div class="btn-row">
      <button class="ghost" id="cancelDeleteConfirm">取消</button>
      <button class="danger" id="confirmDeleteBtn" style="border-color:var(--unpaid);color:#fff;background:var(--unpaid);">確定刪除</button>
    </div>
  </div>
  <div class="btn-row">
    <button class="danger" id="deleteProject">刪除此項目</button>
    <button class="ghost" id="cancelEdit">取消</button>
    <button id="saveEdit">儲存</button>
  </div>
</div>

<div id="backupCard" class="card" style="display:none;">
  <h2 id="backupTitle">備份資料</h2>
  <div class="field">
    <label id="backupHint">複製下方文字保存起來，需要時貼回這裡即可還原</label>
    <textarea id="backupText" rows="6" style="width:100%;font-family:monospace;font-size:0.8em;padding:8px;border:1px solid var(--paper-line);border-radius:6px;"></textarea>
  </div>
  <div class="btn-row">
    <button class="ghost" id="cancelBackup">關閉</button>
    <button id="backupActionBtn">複製</button>
  </div>
</div>

<div id="mainArea"></div>

<div id="status">正在載入資料…</div>

<script>
const STORAGE_KEY = 'fee-tracker-projects';
let state = { projects: [], activeId: null };
let editingProjectId = null;

const tabbar = document.getElementById('tabbar');
const mainArea = document.getElementById('mainArea');
const statusEl = document.getElementById('status');
const titleSub = document.getElementById('titleSub');

const newProjectCard = document.getElementById('newProjectCard');
const newName = document.getElementById('newName');
const newTotal = document.getElementById('newTotal');
const newAmount = document.getElementById('newAmount');

const editProjectCard = document.getElementById('editProjectCard');
const editName = document.getElementById('editName');
const editTotal = document.getElementById('editTotal');
const editAmount = document.getElementById('editAmount');
const editExemptGrid = document.getElementById('editExemptGrid');
let tempExempt = new Set();

const backupCard = document.getElementById('backupCard');
const backupTitle = document.getElementById('backupTitle');
const backupHint = document.getElementById('backupHint');
const backupText = document.getElementById('backupText');
const backupActionBtn = document.getElementById('backupActionBtn');
let backupMode = 'export';

document.getElementById('refreshBtn').addEventListener('click', () => {
  location.reload();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  backupMode = 'export';
  newProjectCard.style.display = 'none';
  editProjectCard.style.display = 'none';
  mainArea.style.display = 'none';
  backupCard.style.display = 'block';
  backupTitle.textContent = '備份資料';
  backupHint.style.color = '';
  backupHint.textContent = '點「複製」把下方文字存到備忘錄或訊息裡，之後可用「還原備份」貼回來';
  backupText.value = JSON.stringify(state);
  backupActionBtn.textContent = '複製';
  backupText.focus();
  backupText.select();
});

document.getElementById('importBtn').addEventListener('click', () => {
  backupMode = 'import';
  newProjectCard.style.display = 'none';
  editProjectCard.style.display = 'none';
  mainArea.style.display = 'none';
  backupCard.style.display = 'block';
  backupTitle.textContent = '還原備份';
  backupHint.style.color = '';
  backupHint.textContent = '把之前複製的備份文字貼在下方，再按「還原」';
  backupText.value = '';
  backupActionBtn.textContent = '還原';
  backupText.focus();
});

document.getElementById('cancelBackup').addEventListener('click', () => {
  closeForms();
});

backupActionBtn.addEventListener('click', async () => {
  if(backupMode === 'export'){
    try{
      await navigator.clipboard.writeText(backupText.value);
      backupActionBtn.textContent = '已複製 ✓';
      setTimeout(() => { backupActionBtn.textContent = '複製'; }, 1500);
    }catch(e){
      backupText.select();
    }
  } else {
    try{
      const parsed = JSON.parse(backupText.value);
      if(!parsed || !Array.isArray(parsed.projects)) throw new Error('格式錯誤');
      parsed.projects.forEach(p => { if(!Array.isArray(p.exempt)) p.exempt = []; });
      state = parsed;
      closeForms();
      render();
      saveState();
    }catch(e){
      backupHint.textContent = '還原失敗，請確認貼上的內容是完整的備份文字';
      backupHint.style.color = 'var(--unpaid)';
    }
  }
});

function uid(){
  return 'p' + Date.now() + Math.floor(Math.random()*1000);
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.projects)){
        state = parsed;
        state.projects.forEach(p => {
          if(!Array.isArray(p.exempt)) p.exempt = [];
          if(!p.paidDates || typeof p.paidDates !== 'object') p.paidDates = {};
          if(typeof p.closed !== 'boolean') p.closed = false;
          if(!('closedDate' in p)) p.closedDate = null;
        });
      }
    }
  }catch(e){
    // no data yet, or storage unavailable
  }
  statusEl.textContent = '';
  if(state.projects.length === 0){
    openNewProjectForm(true);
  }
  render();
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('localStorage save failed', e);
    statusEl.textContent = '儲存失敗：瀏覽器儲存空間可能已滿或被封鎖（例如無痕模式）';
  }
}

function getActiveProject(){
  return state.projects.find(p => p.id === state.activeId) || null;
}

let archiveView = false;

function render(){
  renderTabs();
  if(archiveView){
    renderArchive();
    titleSub.textContent = '封存項目';
    return;
  }
  const proj = getActiveProject();
  if(!proj){
    mainArea.innerHTML = '';
    titleSub.textContent = state.projects.length === 0 ? '尚未建立任何項目' : '請選擇一個項目';
    return;
  }
  titleSub.textContent = proj.name + '・共 ' + proj.total + ' 人' + (proj.amount ? '・每人 ' + proj.amount + ' 元' : '');
  renderProject(proj);
}

function renderTabs(){
  tabbar.innerHTML = '';
  const openProjects = state.projects.filter(p => !p.closed);
  const closedProjects = state.projects.filter(p => p.closed);
  openProjects.forEach(p => {
    const btn = document.createElement('div');
    const unpaidN = p.total - p.paid.length - (p.exempt ? p.exempt.length : 0);
    btn.className = 'tab' + (!archiveView && p.id === state.activeId ? ' active' : '');
    btn.textContent = p.name + (unpaidN > 0 ? ' (' + unpaidN + ')' : ' ✓');
    btn.addEventListener('click', () => {
      archiveView = false;
      state.activeId = p.id;
      lastAction = null;
      closeForms();
      render();
      saveState();
    });
    tabbar.appendChild(btn);
  });
  const addBtn = document.createElement('div');
  addBtn.className = 'tab-add';
  addBtn.textContent = '+ 新增項目';
  addBtn.addEventListener('click', () => { archiveView = false; openNewProjectForm(false); });
  tabbar.appendChild(addBtn);

  if(closedProjects.length > 0){
    const archiveBtn = document.createElement('div');
    archiveBtn.className = 'tab' + (archiveView ? ' active' : '');
    archiveBtn.style.marginLeft = '4px';
    archiveBtn.textContent = '📦 封存 (' + closedProjects.length + ')';
    archiveBtn.addEventListener('click', () => {
      archiveView = true;
      closeForms();
      render();
    });
    tabbar.appendChild(archiveBtn);
  }
}

function renderProject(proj){
  const exempt = proj.exempt || [];
  const unpaidSeats = [];
  for(let i = 1; i <= proj.total; i++){
    if(exempt.includes(i)) continue;
    if(!proj.paid.includes(i)) unpaidSeats.push(i);
  }
  const payerCount = proj.total - exempt.length;

  const wrap = document.createElement('div');

  const card1 = document.createElement('div');
  card1.className = 'card';

  const headerRow = document.createElement('div');
  headerRow.className = 'project-header';
  headerRow.innerHTML = `
    <div>
      <div class="name">${escapeHtml(proj.name)}</div>
      <div class="meta">共 ${proj.total} 人${exempt.length ? '（免繳 ' + exempt.length + ' 人）' : ''}${proj.amount ? '・每人 ' + proj.amount + ' 元' : ''}</div>
    </div>
  `;
  const editBtn = document.createElement('button');
  editBtn.className = 'icon-btn';
  editBtn.textContent = '編輯項目';
  editBtn.addEventListener('click', () => openEditProjectForm(proj));

  const archiveBtn = document.createElement('button');
  archiveBtn.className = 'icon-btn';
  archiveBtn.textContent = '封存項目';
  archiveBtn.addEventListener('click', () => {
    proj.closed = true;
    proj.closedDate = new Date().toISOString();
    const nextOpen = state.projects.find(p => !p.closed);
    state.activeId = nextOpen ? nextOpen.id : null;
    lastAction = null;
    render();
    saveState();
  });

  const headerBtns = document.createElement('div');
  headerBtns.style.display = 'flex';
  headerBtns.style.gap = '6px';
  headerBtns.appendChild(editBtn);
  headerBtns.appendChild(archiveBtn);
  headerRow.appendChild(headerBtns);
  card1.appendChild(headerRow);

  const feedback = document.createElement('div');
  feedback.id = 'feedbackMsg';
  if(lastAction){
    feedback.className = 'feedback show ' + lastAction.type;
    feedback.textContent = lastAction.text;
  } else {
    feedback.className = 'feedback';
  }
  card1.appendChild(feedback);

  const quickEntry = document.createElement('div');
  quickEntry.className = 'quick-entry';
  const seatInput = document.createElement('input');
  seatInput.type = 'number';
  seatInput.id = 'manualSeatInput';
  seatInput.placeholder = '輸入座號';
  seatInput.setAttribute('inputmode', 'numeric');
  seatInput.setAttribute('min', '1');
  seatInput.setAttribute('max', String(proj.total));
  const seatBtn = document.createElement('button');
  seatBtn.textContent = '登記已繳';
  seatBtn.id = 'manualSeatBtn';
  seatBtn.addEventListener('click', () => submitManualEntry(proj));
  seatInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      submitManualEntry(proj);
    }
  });
  quickEntry.appendChild(seatInput);
  quickEntry.appendChild(seatBtn);
  card1.appendChild(quickEntry);

  const focusTarget = focusManualInputAfterRender;
  focusManualInputAfterRender = false;

  const summary = document.createElement('div');
  summary.className = 'summary';
  const collected = proj.paid.length * (proj.amount || 0);
  const expected = payerCount * (proj.amount || 0);
  summary.innerHTML = `
    <div>
      <div class="count ${unpaidSeats.length === 0 ? 'zero' : ''}">${unpaidSeats.length}</div>
      <div class="label">尚未繳交</div>
    </div>
    ${proj.amount ? `<div class="amount">已收金額<br><strong>${collected}</strong> / ${expected} 元</div>` : ''}
  `;
  card1.appendChild(summary);

  const grid = document.createElement('div');
  grid.className = 'grid';
  for(let i = 1; i <= proj.total; i++){
    const isExempt = exempt.includes(i);
    const isPaid = proj.paid.includes(i);
    const el = document.createElement('div');
    if(isExempt){
      el.className = 'seat exempt';
      el.innerHTML = '<span class="seat-num">' + i + '</span><span class="seat-tag">免繳</span>';
    } else if(isPaid){
      el.className = 'seat paid';
      const dateStr = proj.paidDates && proj.paidDates[i] ? formatShortDate(proj.paidDates[i]) : '';
      el.innerHTML = '<span class="seat-num">' + i + '</span>' + (dateStr ? '<span class="seat-tag">' + dateStr + '</span>' : '');
    } else {
      el.className = 'seat';
      el.textContent = i;
    }
    grid.appendChild(el);
  }
  card1.appendChild(grid);

  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = '輸入座號後按「登記已繳」，會自動蓋上日期時間並標記為綠色；同一座號再輸入一次可改回未繳。灰色為免繳座號。格子僅供查看，無法直接點選';
  card1.appendChild(hint);

  wrap.appendChild(card1);

  const card2 = document.createElement('div');
  card2.className = 'card';
  const listTitle = document.createElement('span');
  listTitle.className = 'section-title';
  listTitle.textContent = '未繳名單';
  card2.appendChild(listTitle);

  const list = document.createElement('div');
  list.className = 'unpaid-list';
  if(unpaidSeats.length === 0){
    list.innerHTML = '<span class="none">全部繳交完畢</span>';
  } else {
    list.textContent = unpaidSeats.map(n => '座號 ' + n).join('、');
  }
  card2.appendChild(list);

  const paidTitle = document.createElement('span');
  paidTitle.className = 'section-title';
  paidTitle.textContent = '已繳記錄';
  card2.appendChild(paidTitle);

  const paidListEl = document.createElement('div');
  paidListEl.className = 'paid-list';
  const paidSeatsSorted = proj.paid.slice().sort((a,b) => a - b);
  if(paidSeatsSorted.length === 0){
    paidListEl.innerHTML = '<span class="none">尚無登記</span>';
  } else {
    paidListEl.innerHTML = paidSeatsSorted.map(n => {
      const d = proj.paidDates && proj.paidDates[n] ? formatDT(proj.paidDates[n]) : '';
      return '<span class="entry">座號 ' + n + (d ? '（' + d + '）' : '') + '</span>';
    }).join('');
  }
  card2.appendChild(paidListEl);

  const resetRow = document.createElement('div');
  resetRow.style.marginTop = '10px';
  resetRow.style.textAlign = 'right';
  const resetBtn = document.createElement('button');
  resetBtn.className = 'ghost';
  resetBtn.textContent = '全部重設為未繳';
  const resetConfirmBar = document.createElement('div');
  resetConfirmBar.style.display = 'none';
  resetConfirmBar.style.marginTop = '8px';
  resetConfirmBar.style.background = '#f5e2dd';
  resetConfirmBar.style.border = '1px solid var(--unpaid)';
  resetConfirmBar.style.borderRadius = '6px';
  resetConfirmBar.style.padding = '10px';
  resetConfirmBar.innerHTML = `
    <div style="font-size:0.85em;margin-bottom:8px;">確定要將「${escapeHtml(proj.name)}」所有人重設為未繳嗎？</div>
  `;
  const resetConfirmActions = document.createElement('div');
  resetConfirmActions.className = 'btn-row';
  const resetCancelBtn = document.createElement('button');
  resetCancelBtn.className = 'ghost';
  resetCancelBtn.textContent = '取消';
  resetCancelBtn.addEventListener('click', () => { resetConfirmBar.style.display = 'none'; });
  const resetConfirmBtn = document.createElement('button');
  resetConfirmBtn.textContent = '確定重設';
  resetConfirmBtn.style.background = 'var(--unpaid)';
  resetConfirmBtn.style.borderColor = 'var(--unpaid)';
  resetConfirmBtn.addEventListener('click', () => {
    proj.paid = [];
    proj.paidDates = {};
    lastAction = null;
    render();
    saveState();
  });
  resetConfirmActions.appendChild(resetCancelBtn);
  resetConfirmActions.appendChild(resetConfirmBtn);
  resetConfirmBar.appendChild(resetConfirmActions);
  resetBtn.addEventListener('click', () => {
    resetConfirmBar.style.display = 'block';
  });
  resetRow.appendChild(resetBtn);
  card2.appendChild(resetRow);
  card2.appendChild(resetConfirmBar);

  wrap.appendChild(card2);

  mainArea.innerHTML = '';
  mainArea.appendChild(wrap);

  if(focusTarget){
    const el = document.getElementById('manualSeatInput');
    if(el){ el.value = ''; el.focus(); }
  }
}

function renderArchive(){
  mainArea.innerHTML = '';
  const closedProjects = state.projects.filter(p => p.closed);
  if(closedProjects.length === 0){
    const empty = document.createElement('div');
    empty.className = 'card';
    empty.innerHTML = '<div class="hint" style="margin:0;">目前沒有封存項目</div>';
    mainArea.appendChild(empty);
    return;
  }
  closedProjects
    .slice()
    .sort((a,b) => (b.closedDate || '').localeCompare(a.closedDate || ''))
    .forEach(proj => {
      const exempt = proj.exempt || [];
      const collected = proj.paid.length * (proj.amount || 0);
      const payerCount = proj.total - exempt.length;
      const expected = payerCount * (proj.amount || 0);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="project-header">
          <div>
            <div class="name">${escapeHtml(proj.name)}</div>
            <div class="meta">共 ${proj.total} 人${exempt.length ? '（免繳 ' + exempt.length + ' 人）' : ''}${proj.amount ? '・每人 ' + proj.amount + ' 元' : ''}</div>
            <div class="meta">封存於 ${proj.closedDate ? formatDT(proj.closedDate) : ''}</div>
          </div>
        </div>
        ${proj.amount ? `<div class="amount" style="text-align:left;margin-bottom:10px;">已收金額 <strong>${collected}</strong> / ${expected} 元</div>` : ''}
      `;
      const btnRow = document.createElement('div');
      btnRow.className = 'btn-row';
      const restoreBtn = document.createElement('button');
      restoreBtn.className = 'secondary';
      restoreBtn.textContent = '還原此項目';
      restoreBtn.addEventListener('click', () => {
        proj.closed = false;
        proj.closedDate = null;
        state.activeId = proj.id;
        archiveView = false;
        render();
        saveState();
      });
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'danger';
      deleteBtn.textContent = '刪除';
      deleteBtn.addEventListener('click', () => {
        if(deleteBtn.textContent === '刪除'){
          deleteBtn.textContent = '確定刪除？';
          deleteBtn.style.background = 'var(--unpaid)';
          deleteBtn.style.color = '#fff';
          return;
        }
        state.projects = state.projects.filter(p => p.id !== proj.id);
        render();
        saveState();
      });
      btnRow.appendChild(restoreBtn);
      btnRow.appendChild(deleteBtn);
      card.appendChild(btnRow);
      mainArea.appendChild(card);
    });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

let lastAction = null;
let focusManualInputAfterRender = false;

function pad2(n){ return String(n).padStart(2, '0'); }

function formatDT(iso){
  const d = new Date(iso);
  return pad2(d.getMonth()+1) + '/' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

function formatShortDate(iso){
  const d = new Date(iso);
  return pad2(d.getMonth()+1) + '/' + pad2(d.getDate());
}

function markSeat(proj, n, viaInput){
  const exempt = proj.exempt || [];
  if(!proj.paidDates) proj.paidDates = {};
  if(exempt.includes(n)){
    lastAction = { text: '座號 ' + n + ' 是免繳座號，不需登記', type: 'warn' };
    focusManualInputAfterRender = viaInput;
    render();
    return;
  }
  const idx = proj.paid.indexOf(n);
  if(idx === -1){
    proj.paid.push(n);
    const now = new Date().toISOString();
    proj.paidDates[n] = now;
    lastAction = { text: '座號 ' + n + ' 已登記為已繳（' + formatDT(now) + '）', type: 'success' };
  } else {
    proj.paid.splice(idx, 1);
    delete proj.paidDates[n];
    lastAction = { text: '座號 ' + n + ' 已改回未繳', type: 'neutral' };
  }
  focusManualInputAfterRender = viaInput;
  render();
  saveState();
}

function submitManualEntry(proj){
  const inputEl = document.getElementById('manualSeatInput');
  const val = inputEl ? inputEl.value.trim() : '';
  const n = parseInt(val);
  if(!val || isNaN(n) || n < 1 || n > proj.total){
    lastAction = { text: '請輸入 1 - ' + proj.total + ' 之間的座號', type: 'error' };
    focusManualInputAfterRender = true;
    render();
    return;
  }
  markSeat(proj, n, true);
}

function closeForms(){
  newProjectCard.style.display = 'none';
  editProjectCard.style.display = 'none';
  backupCard.style.display = 'none';
  mainArea.style.display = '';
}

function openNewProjectForm(isFirst){
  editProjectCard.style.display = 'none';
  backupCard.style.display = 'none';
  newProjectCard.style.display = 'block';
  mainArea.style.display = isFirst ? 'none' : '';
  newName.value = '';
  newTotal.value = 37;
  newAmount.value = '';
  newName.focus();
}

document.getElementById('cancelNew').addEventListener('click', () => {
  if(state.projects.length === 0) return; // must create at least one
  closeForms();
});

document.getElementById('createProject').addEventListener('click', () => {
  const name = newName.value.trim() || '未命名項目';
  const total = Math.max(1, Math.min(60, parseInt(newTotal.value) || 37));
  const amount = Math.max(0, parseInt(newAmount.value) || 0);
  const proj = { id: uid(), name, total, amount, paid: [], exempt: [], paidDates: {}, closed: false, closedDate: null };
  state.projects.push(proj);
  state.activeId = proj.id;
  closeForms();
  render();
  saveState();
});

function renderExemptPicker(){
  const total = Math.max(1, Math.min(60, parseInt(editTotal.value) || 1));
  editExemptGrid.innerHTML = '';
  for(let i = 1; i <= total; i++){
    const el = document.createElement('div');
    el.className = 'picker-seat' + (tempExempt.has(i) ? ' selected' : '');
    el.textContent = i;
    el.addEventListener('click', () => {
      if(tempExempt.has(i)) tempExempt.delete(i);
      else tempExempt.add(i);
      el.classList.toggle('selected');
    });
    editExemptGrid.appendChild(el);
  }
}

editTotal.addEventListener('input', renderExemptPicker);

function openEditProjectForm(proj){
  editingProjectId = proj.id;
  newProjectCard.style.display = 'none';
  backupCard.style.display = 'none';
  editProjectCard.style.display = 'block';
  mainArea.style.display = 'none';
  editName.value = proj.name;
  editTotal.value = proj.total;
  editAmount.value = proj.amount || '';
  tempExempt = new Set(proj.exempt || []);
  renderExemptPicker();
  document.getElementById('deleteConfirmBar').style.display = 'none';
}

document.getElementById('cancelEdit').addEventListener('click', () => {
  editingProjectId = null;
  closeForms();
});

document.getElementById('saveEdit').addEventListener('click', () => {
  const proj = state.projects.find(p => p.id === editingProjectId);
  if(!proj) return;
  proj.name = editName.value.trim() || proj.name;
  const total = Math.max(1, Math.min(60, parseInt(editTotal.value) || proj.total));
  proj.total = total;
  proj.amount = Math.max(0, parseInt(editAmount.value) || 0);
  proj.exempt = Array.from(tempExempt).filter(n => n <= total);
  proj.paid = proj.paid.filter(n => n <= total && !proj.exempt.includes(n));
  if(!proj.paidDates) proj.paidDates = {};
  Object.keys(proj.paidDates).forEach(k => {
    if(!proj.paid.includes(parseInt(k))) delete proj.paidDates[k];
  });
  editingProjectId = null;
  closeForms();
  render();
  saveState();
});

document.getElementById('deleteProject').addEventListener('click', () => {
  document.getElementById('deleteConfirmBar').style.display = 'block';
});

document.getElementById('cancelDeleteConfirm').addEventListener('click', () => {
  document.getElementById('deleteConfirmBar').style.display = 'none';
});

document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
  const proj = state.projects.find(p => p.id === editingProjectId);
  if(!proj) return;
  state.projects = state.projects.filter(p => p.id !== editingProjectId);
  if(state.activeId === editingProjectId){
    state.activeId = state.projects.length > 0 ? state.projects[0].id : null;
  }
  editingProjectId = null;
  document.getElementById('deleteConfirmBar').style.display = 'none';
  closeForms();
  if(state.projects.length === 0){
    openNewProjectForm(true);
  }
  render();
  saveState();
});

loadState();
</script>
